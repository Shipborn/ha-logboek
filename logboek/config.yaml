name: Logboek
version: "0.13.1"
slug: logboek
description: Onderhoudslogboek met foto's en onderhoudstaken (bijv. voor een boot)
url: "https://github.com/Shipborn/ha-logboek"
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:notebook-edit
panel_title: Maintenance Log
panel_admin: false
homeassistant_api: true
services:
  - mqtt:want
map:
  - type: share
    read_only: false
options:
  title: "Onderhoud boot"
  categories:
    - Motor
    - Elektra
    - Romp & onderwaterschip
    - Tuigage & zeilen
    - Sanitair & water
    - Veiligheid
    - Overig
  engine_hours_entity: ""
  warn_days: 14
  warn_hours: 10
  photo_max_px: 2000
  mqtt_enabled: true
  email_enabled: false
  email_to: ""
  email_time: "21:00"
  smtp_host: ""
  smtp_port: 587
  smtp_security: starttls
  smtp_username: ""
  smtp_password: ""
  smtp_from: ""
schema:
  title: str
  categories:
    - str
  engine_hours_entity: str?
  warn_days: int(0,365)
  warn_hours: float(0,1000)
  photo_max_px: int(0,10000)
  mqtt_enabled: bool
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
  email_enabled: bool?
  email_to: str?
  email_time: match(^([01]?[0-9]|2[0-3]):[0-5][0-9]$)?
  smtp_host: str?
  smtp_port: port?
  smtp_security: list(starttls|ssl|geen)?
  smtp_username: str?
  smtp_password: password?
  smtp_from: str?
