<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Logboek</title>
<style>
:root{
  --bg:#f4f5f7;--card:#ffffff;--fg:#1b2230;--muted:#687180;--line:#e2e5ea;--chip:#eef1f5;
  --accent:#0b62b8;--accent-fg:#ffffff;--ok:#1d7f46;--warn:#a96a00;--bad:#c2312f;--shadow:0 1px 2px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111418;--card:#1a1f26;--fg:#e5e8ed;--muted:#97a0ab;--line:#2a313b;--chip:#242b35;
  --accent:#5aa2ea;--accent-fg:#0b1220;--ok:#4cc27e;--warn:#e7b84a;--bad:#f07a78;--shadow:none;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:20px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:13px;padding:3px 10px;border-radius:99px;background:var(--chip);color:var(--muted);white-space:nowrap}
.tabs{display:flex;gap:4px;margin-top:10px}
.tab{border:0;background:none;padding:10px 14px;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer;font-weight:600}
.tab.active{color:var(--fg);border-color:var(--accent)}
.tab .count{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--bad);color:#fff;font-size:12px;line-height:18px;text-align:center}
main{max-width:860px;margin:0 auto;padding:14px 16px 100px}
.filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filters input{flex:1 1 180px}
.filters select{flex:0 1 200px}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.summary{color:var(--muted);font-size:13px;margin:0 2px 10px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.summary a{color:var(--accent);text-decoration:none}
#mailTest{margin-right:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer}
.card:hover{border-color:var(--muted)}
.meta{display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:13px}
.chip{background:var(--chip);border-radius:6px;padding:1px 7px;color:var(--fg);font-size:12px}
.card h3{margin:4px 0 2px;font-size:16px}
.desc{color:var(--muted);font-size:14px;margin:2px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.thumbs{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:8px;flex:none;background:var(--chip)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.status{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.s-achterstallig .dot{background:var(--bad)} .s-achterstallig .status{color:var(--bad)}
.s-binnenkort .dot{background:var(--warn)} .s-binnenkort .status{color:var(--warn)}
.s-ok .dot{background:var(--ok)} .s-ok .status{color:var(--ok)}
.s-inactief{opacity:.6}
.taskrow{display:flex;gap:10px;align-items:flex-start}
.taskrow .grow{flex:1;min-width:0}
.due{font-size:13px;color:var(--muted);margin-top:4px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.6;cursor:default}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);font-size:30px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
dialog{border:0;border-radius:16px;padding:0;width:min(640px,calc(100vw - 20px));max-height:calc(100vh - 20px);background:var(--card);color:var(--fg)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{display:flex;flex-direction:column;max-height:calc(100vh - 20px)}
.dhead{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.dhead h2{font-size:17px;margin:0;flex:1}
.x{border:0;background:none;font-size:24px;line-height:1;cursor:pointer;color:var(--muted);padding:2px 6px}
.dbody{padding:14px 16px;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.dbody .full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
label.check{flex-direction:row;align-items:center;gap:8px}
label.check input{width:auto}
.dfoot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.dfoot .left{margin-right:auto}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.ph{position:relative;width:88px;height:88px}
.ph img{width:100%;height:100%;object-fit:cover;border-radius:8px;cursor:zoom-in}
.ph button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-size:15px;line-height:1;cursor:pointer}
.ph.new img{outline:2px dashed var(--accent);outline-offset:-2px}
.addph{width:88px;height:88px;border:2px dashed var(--line);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-size:12px;cursor:pointer;text-align:center;gap:2px}
.addph span{font-size:26px;line-height:1}
.addph.busy{opacity:.5;pointer-events:none}
.vals{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:4px}
.val{background:var(--chip);border-radius:6px;padding:1px 7px;font-size:12px;color:var(--muted)}
.val b{color:var(--fg);font-weight:600}
.entpick{display:flex;flex-direction:column;gap:6px}
.entpick .chips{display:flex;flex-wrap:wrap;gap:6px}
.entpick .chips:empty::before{content:"Nog geen meetwaarden.";font-size:12px;color:var(--muted)}
.entchip{display:inline-flex;align-items:center;gap:4px;background:var(--chip);border-radius:14px;padding:3px 4px 3px 10px;font-size:13px}
.entchip small{color:var(--muted)}
.entchip button{border:0;background:none;cursor:pointer;font-size:15px;line-height:1;color:var(--muted);padding:0 4px}
.entpick .add{display:flex;gap:6px}
.entpick .add input{flex:1;min-width:0}
.catents{margin-bottom:14px}
.catents h3{font-size:14px;margin:0 0 6px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.hint{font-size:12px;color:var(--muted);font-weight:400}
.meta .stamp{margin-left:auto;font-size:12px}
p.hint{margin:0}
#lightbox{background:#000;width:100vw;height:100vh;max-width:100vw;max-height:100vh;margin:0;border-radius:0}
#lightbox img{width:100%;height:100%;object-fit:contain;cursor:zoom-out}
#lightbox .nav{position:fixed;top:50%;transform:translateY(-50%);border:0;background:rgba(255,255,255,.15);color:#fff;font-size:28px;width:46px;height:46px;border-radius:50%;cursor:pointer}
#lightbox .prev{left:12px} #lightbox .next{right:12px}
#lightbox .close{position:fixed;top:12px;right:12px;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:24px;width:42px;height:42px;border-radius:50%;cursor:pointer}
.catadd{display:flex;gap:8px;margin-bottom:12px}
.chev{color:var(--muted);font-size:22px;line-height:1;align-self:center}
#histDlg .dbody, #catDlg .dbody{display:block}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:14px}
.stat{background:var(--chip);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-size:17px}
.stat span{font-size:12px;color:var(--muted)}
.hnote{background:var(--chip);border-radius:10px;padding:8px 10px;font-size:14px;white-space:pre-line;margin:0 0 14px}
.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 14px 12px;cursor:pointer}
.tl li::before{content:"";position:absolute;left:-21px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--card)}
.tl li:hover h4{text-decoration:underline}
.tl h4{margin:2px 0;font-size:15px}
.tl .gap{font-size:12px;color:var(--muted);font-weight:600}
.tl .full-desc{font-size:14px;color:var(--muted);white-space:pre-line;margin:2px 0 0}
.catrow{display:flex;align-items:center;gap:8px;cursor:default;padding:8px 10px}
.catrow .info{flex:1;min-width:0;cursor:pointer}
.catrow .info:hover .name{text-decoration:underline}
.catrow .name{font-weight:600;overflow-wrap:anywhere}
.catrow .use{color:var(--muted);font-size:12px}
.catrow input{flex:1}
.ib{border:1px solid var(--line);background:var(--card);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:15px;line-height:1;flex:none;color:var(--fg)}
.ib:disabled{opacity:.35;cursor:default}
.ib.danger{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;max-width:90vw}
.toast.show{opacity:1}
@media (max-width:520px){.dbody{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1 id="title">Logboek</h1>
    <span class="pill" id="hours" hidden></span>
  </div>
  <nav class="tabs">
    <button class="tab active" data-tab="log">Logboek</button>
    <button class="tab" data-tab="tasks">Taken<span class="count" id="lateCount" hidden></span></button>
    <button class="tab" data-tab="cats">Categorieën</button>
  </nav>
</header>

<main>
  <section id="view-log">
    <div class="filters">
      <input id="q" type="search" placeholder="Zoeken…">
      <select id="fcat"><option value="">Alle categorieën</option></select>
    </div>
    <div class="summary"><span id="sum"></span><span><a href="#" id="mailTest" hidden>Testmail sturen</a> <a href="api/export.csv" download>CSV exporteren</a></span></div>
    <div id="entries"></div>
  </section>
  <section id="view-tasks" hidden>
    <div id="tasks"></div>
  </section>
  <section id="view-cats" hidden>
    <form class="catadd" id="catAdd">
      <input name="naam" placeholder="Nieuwe categorie, bijv. Dek & beslag" maxlength="60" required>
      <button class="btn primary" type="submit">Toevoegen</button>
    </form>
    <div id="cats"></div>
    <p class="hint" style="margin:12px 2px">Bij hernoemen gaan bestaande logregels en taken mee. Bij verwijderen blijven logregels en taken bewaard, maar zonder categorie.</p>
  </section>
</main>

<button class="fab" id="fab" title="Nieuw" aria-label="Nieuw">+</button>

<!-- Logregel -->
<dialog id="entryDlg">
  <form id="entryForm" method="dialog">
    <div class="dhead"><h2 id="entryTitle">Nieuwe logregel</h2><button type="button" class="x" data-close>×</button></div>
    <div class="dbody">
      <label>Datum<input type="date" name="datum" required></label>
      <label>Categorie<select name="categorie"></select></label>
      <label class="full">Onderhoudstaak <span class="hint">(optioneel — zet de teller van de taak op nul)</span>
        <select name="task_id"><option value="">— geen —</option></select></label>
      <label class="full">Titel<input name="titel" required placeholder="Bijv. impeller koelwaterpomp vervangen"></label>
      <label>Uitgevoerd door<input name="uitgevoerd_door" placeholder="Zelf, werf, monteur…"></label>
      <label>Bestede tijd<input name="duur" inputmode="decimal" placeholder="uur:min, bijv. 1:30"></label>
      <label class="full">Omschrijving<textarea name="omschrijving" placeholder="Wat is er gedaan, gebruikte onderdelen, bevindingen…"></textarea></label>
      <div class="full" id="entryVals" hidden></div>
      <p class="full hint" id="entryStamp" hidden></p>
      <div class="full">
        <label>Foto's</label>
        <div class="photos" id="photoList"></div>
        <!-- niet "hidden": sommige Android-webviews openen dan geen kiezer; geopend via <label for> -->
        <input type="file" id="camInput" class="vh" accept="image/*" capture="environment" tabindex="-1">
        <input type="file" id="fileInput" class="vh" accept="image/*" multiple tabindex="-1">
      </div>
    </div>
    <div class="dfoot">
      <button type="button" class="btn danger left" id="entryDelete" hidden>Verwijderen</button>
      <button type="button" class="btn" data-close>Annuleren</button>
      <button type="submit" class="btn primary" id="entrySave">Opslaan</button>
    </div>
  </form>
</dialog>

<!-- Taak -->
<dialog id="taskDlg">
  <form id="taskForm" method="dialog">
    <div class="dhead"><h2 id="taskTitle">Nieuwe taak</h2><button type="button" class="x" data-close>×</button></div>
    <div class="dbody">
      <label class="full">Naam<input name="naam" required placeholder="Bijv. Motorolie + filter"></label>
      <label class="full">Categorie<select name="categorie"></select></label>
      <label>Elke … dagen<input name="interval_dagen" inputmode="numeric" placeholder="bijv. 365"></label>
      <label>Elke … motoruren<input name="interval_uren" inputmode="decimal" placeholder="bijv. 100"></label>
      <p class="hint full" style="margin:0">Vul één of beide in. Bij beide geldt wat het eerst komt.</p>
      <label class="full">Notitie<textarea name="notitie" placeholder="Onderdeelnummers, olietype, inhoud…"></textarea></label>
      <div class="full"><label>Meetwaarden uit Home Assistant <span class="hint">(bij elke nieuwe logregel van deze taak automatisch opgeslagen)</span></label>
        <div class="entpick" id="taskEnts"></div></div>
      <label class="check full"><input type="checkbox" name="actief" checked> Actief</label>
    </div>
    <div class="dfoot">
      <button type="button" class="btn danger left" id="taskDelete" hidden>Verwijderen</button>
      <button type="button" class="btn" data-close>Annuleren</button>
      <button type="submit" class="btn primary">Opslaan</button>
    </div>
  </form>
</dialog>

<datalist id="haEntities"></datalist>

<!-- Logregels per categorie -->
<dialog id="catDlg">
  <form method="dialog">
    <div class="dhead"><h2 id="catTitle">Categorie</h2><button type="button" class="x" data-close>×</button></div>
    <div class="dbody" id="catBody"></div>
    <div class="dfoot">
      <button type="button" class="btn primary" id="catNew">Nieuwe logregel</button>
    </div>
  </form>
</dialog>

<!-- Geschiedenis per taak -->
<dialog id="histDlg">
  <form method="dialog">
    <div class="dhead"><h2 id="histTitle">Geschiedenis</h2><button type="button" class="x" data-close>×</button></div>
    <div class="dbody" id="histBody"></div>
    <div class="dfoot">
      <button type="button" class="btn left" id="histEdit">Taak bewerken</button>
      <button type="button" class="btn primary" id="histDone">Uitgevoerd</button>
    </div>
  </form>
</dialog>

<dialog id="lightbox">
  <img alt="">
  <button class="nav prev" aria-label="Vorige">‹</button>
  <button class="nav next" aria-label="Volgende">›</button>
  <button class="close" aria-label="Sluiten">×</button>
</dialog>

<div class="toast" id="toast"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('nl-NL', {day:'numeric', month:'short', year:'numeric'}) : '';
const fmtNum = (n, dec = 1) => n == null ? '' : Number(n).toLocaleString('nl-NL', {maximumFractionDigits: dec});
// tijdstempels zonder offset (vóór 0.4.0) zijn UTC
const fmtStamp = s => s ? new Date(/[zZ]|[+-]\d\d:\d\d$/.test(s) ? s : s + 'Z').toLocaleString('nl-NL',
  {day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'}) : '';
const fmtDur = m => m == null ? '' : m < 60 ? `${m} min` : `${Math.floor(m / 60)} u` + (m % 60 ? ` ${m % 60} min` : '');
const durInput = m => m == null ? '' : `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`;
const nlNum = n => n == null ? '' : String(n).replace('.', ',');
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };

let CFG = {categories: []}, TASKS = [], ENTRIES = [], CATS = [], TAB = 'log', catEdit = null;
let editing = null, pending = [], lbList = [], lbIdx = 0;

async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  if (!r.ok) {
    let msg = r.statusText;
    try { msg = (await r.json()).error || msg; } catch (_) {}
    throw new Error(msg || 'Er ging iets mis');
  }
  return (r.headers.get('content-type') || '').includes('json') ? r.json() : r.text();
}

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2600);
}

function fillSelect(sel, items, first) {
  sel.innerHTML = (first ? `<option value="">${esc(first)}</option>` : '') +
    items.map(i => `<option value="${esc(i.value ?? i)}">${esc(i.label ?? i)}</option>`).join('');
}

// ---------------------------------------------------------------- laden
async function loadConfig() {
  CFG = await api('api/config');
  $('#title').textContent = CFG.title; document.title = CFG.title;
  const h = $('#hours');
  if (CFG.motoruren != null) { h.hidden = false; h.textContent = `${fmtNum(CFG.motoruren)} motoruren`; }
  else h.hidden = true;
  $('#mailTest').hidden = !CFG.email;
  fillSelect($('#fcat'), CFG.categories, 'Alle categorieën');
  fillSelect($('#entryForm [name=categorie]'), CFG.categories, '—');
  fillSelect($('#taskForm [name=categorie]'), CFG.categories, '—');
}

async function loadEntries() {
  const p = new URLSearchParams();
  if ($('#q').value.trim()) p.set('q', $('#q').value.trim());
  if ($('#fcat').value) p.set('categorie', $('#fcat').value);
  ENTRIES = await api('api/entries?' + p);
  renderEntries();
}

async function loadTasks() {
  TASKS = await api('api/tasks');
  renderTasks();
  const late = TASKS.filter(t => t.status === 'achterstallig').length;
  const c = $('#lateCount'); c.hidden = !late; c.textContent = late;
  fillSelect($('#entryForm [name=task_id]'),
    TASKS.filter(t => t.actief).map(t => ({value: t.id, label: t.naam})), '— geen —');
}

// ---------------------------------------------------------------- logboek
function renderEntries() {
  const el = $('#entries');
  $('#sum').textContent = `${ENTRIES.length} ${ENTRIES.length === 1 ? 'regel' : 'regels'}`;
  if (!ENTRIES.length) {
    el.innerHTML = `<div class="empty">${$('#q').value || $('#fcat').value ? 'Niets gevonden.' : 'Nog geen logregels. Tik op + om te beginnen.'}</div>`;
    return;
  }
  el.innerHTML = ENTRIES.map(e => `
    <article class="card" data-id="${e.id}">
      <div class="meta">
        <span>${fmtDate(e.datum)}</span>
        ${e.categorie ? `<span class="chip">${esc(e.categorie)}</span>` : ''}
        ${e.taak_naam ? `<span class="chip">⟳ ${esc(e.taak_naam)}</span>` : ''}
        ${e.duur_minuten != null ? `<span title="Bestede tijd">⏱ ${fmtDur(e.duur_minuten)}</span>` : ''}
        ${e.created_at ? `<span class="stamp" title="Opgeslagen">opgeslagen ${fmtStamp(e.created_at)}</span>` : ''}
      </div>
      <h3>${esc(e.titel)}</h3>
      ${e.omschrijving ? `<p class="desc">${esc(e.omschrijving)}</p>` : ''}
      ${valsHtml(e.waarden)}
      ${e.fotos.length ? `<div class="thumbs">${e.fotos.map((f, i) =>
        `<img loading="lazy" src="photos/${f.thumb}" data-lb="${e.id}" data-i="${i}" alt="">`).join('')}</div>` : ''}
    </article>`).join('');
}

$('#entries').addEventListener('click', ev => {
  const img = ev.target.closest('img[data-lb]');
  if (img) {
    const e = ENTRIES.find(x => x.id == img.dataset.lb);
    openLightbox(e.fotos.map(f => 'photos/' + f.bestand), +img.dataset.i);
    return;
  }
  const card = ev.target.closest('.card');
  if (card) openEntry(ENTRIES.find(x => x.id == card.dataset.id));
});

$('#mailTest').addEventListener('click', async ev => {
  ev.preventDefault();
  toast('Testmail wordt verstuurd…');
  try {
    const r = await api('api/email/test', {method: 'POST'});
    toast(`Testmail verstuurd (${r.logregels} ${r.logregels === 1 ? 'logregel' : 'logregels'} van vandaag)`);
  } catch (e) { toast(e.message); }
});

// Verklein en zet om naar JPEG in de browser: telefoonfoto's (ook HEIF van Samsung) worden
// klein genoeg voor een snelle upload via ingress. Lukt dat niet, dan gaat het origineel mee.
async function shrinkPhoto(file) {
  const max = CFG.photo_max_px || 2000;
  try {
    const bmp = await createImageBitmap(file, {imageOrientation: 'from-image'});
    const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    bmp.close();
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.88));
    if (!blob) throw new Error('toBlob mislukt');
    return new File([blob], (file.name || 'foto').replace(/\.[^.]*$/, '') + '.jpg', {type: 'image/jpeg'});
  } catch (e) {
    console.warn('Foto niet verkleind, origineel wordt geüpload', e);
    return file;
  }
}

}

const ORDER = {achterstallig: 0, binnenkort: 1, onbekend: 2, ok: 3, inactief: 4};
const LABEL = {achterstallig: 'Achterstallig', binnenkort: 'Binnenkort', onbekend: 'Nog niet gelogd', ok: 'In orde', inactief: 'Inactief'};

function dueText(t) {
  const parts = [];
  if (t.interval_dagen) {
    if (t.dagen_rest == null) parts.push(`elke ${t.interval_dagen} dagen`);
    else if (t.dagen_rest < 0) parts.push(`${-t.dagen_rest} dagen te laat (${fmtDate(t.volgende_datum)})`);
    else if (t.dagen_rest === 0) parts.push(`vandaag`);
    else parts.push(`over ${t.dagen_rest} dagen (${fmtDate(t.volgende_datum)})`);
  }
  if (t.interval_uren) {
    if (t.volgende_uren == null) parts.push(`elke ${fmtNum(t.interval_uren)} motoruren`);
    else if (t.uren_rest == null) parts.push(`bij ${fmtNum(t.volgende_uren)} u`);
    else if (t.uren_rest < 0) parts.push(`${fmtNum(-t.uren_rest)} u te laat (bij ${fmtNum(t.volgende_uren)} u)`);
    else parts.push(`over ${fmtNum(t.uren_rest)} u (bij ${fmtNum(t.volgende_uren)} u)`);
  }
  return parts.join(' · ') || 'geen interval';
}

function renderTasks() {

// ---------------------------------------------------------------- geschiedenis per taak
let histTask = null;
const dayDiff = (a, b) => Math.round((new Date(a + 'T00:00:00') - new Date(b + 'T00:00:00')) / 86400000);

async function openHistory(id) {
  histTask = id;
  await renderHistory();
  if (!$('#histDlg').open) $('#histDlg').showModal();
}

async function renderHistory() {
  const t = TASKS.find(x => x.id === histTask);
  if (!t) { $('#histDlg').close(); return; }
  const list = await api('api/entries?task_id=' + t.id);   // nieuwste eerst
  $('#histTitle').textContent = t.naam;
  $('#histDone').hidden = !t.actief;

  // tussenpozen tussen opeenvolgende uitvoeringen
  const asc = [...list].reverse(), dGaps = [], hGaps = [];
  const gap = {};
  for (let i = 1; i < asc.length; i++) {
    const d = dayDiff(asc[i].datum, asc[i - 1].datum); dGaps.push(d);
    const g = {d};
    if (asc[i].motoruren != null && asc[i - 1].motoruren != null) {
      g.h = Math.round((asc[i].motoruren - asc[i - 1].motoruren) * 10) / 10; hGaps.push(g.h);
    }
    gap[asc[i].id] = g;
  }
  const avg = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;
  const tijd = list.reduce((s, e) => s + (e.duur_minuten || 0), 0);

  const stats = [
    [`${list.length}×`, 'uitgevoerd'],
    [tijd ? fmtDur(tijd) : '—', 'totale tijd'],
    [avg(dGaps) != null ? `${fmtNum(avg(dGaps), 0)} d` : '—', 'gem. tussenpoos' + (t.interval_dagen ? ` (interval ${t.interval_dagen})` : '')],
  ];
  if (t.interval_uren || hGaps.length)
    stats.push([avg(hGaps) != null ? `${fmtNum(avg(hGaps))} u` : '—', 'gem. motoruren' + (t.interval_uren ? ` (interval ${fmtNum(t.interval_uren)})` : '')]);

  $('#histBody').innerHTML = `
    <div class="meta s-${t.status}" style="margin-bottom:10px;opacity:1">
      <span class="status"><span class="dot"></span>${LABEL[t.status]}</span>
      ${t.categorie ? `<span class="chip">${esc(t.categorie)}</span>` : ''}
      <span>Volgende: ${dueText(t)}</span>
    </div>
    <div class="stats">${stats.map(([v, l]) => `<div class="stat"><b>${v}</b><span>${esc(l)}</span></div>`).join('')}</div>
    ${t.notitie ? `<p class="hnote">${esc(t.notitie)}</p>` : ''}
    ${list.length ? `<ul class="tl">${list.map(e => {
      const g = gap[e.id];
      return tlItem(e, g ? `+${g.d} dagen${g.h != null ? ` · +${fmtNum(g.h)} u` : ''} sinds vorige` : 'eerste keer gelogd');
    }).join('')}</ul>`
    : `<div class="empty">Nog niet uitgevoerd.<br>Tik op <b>Uitgevoerd</b> om de eerste keer te loggen.</div>`}
`;
  $('#histBody')._list = list;
}

// keuzelijst met entiteiten; onChange krijgt de nieuwe lijst
function entPicker(el, list, onChange) {
  el._list = [...list];
  const draw = () => {
    el.innerHTML = `<div class="chips">${el._list.map((id, i) =>
      `<span class="entchip">${esc(entName(id) || id)}${entName(id) ? ` <small>${esc(id)}</small>` : ''}
        <button type="button" data-rm="${i}" aria-label="Weghalen">×</button></span>`).join('')}</div>
      <div class="add"><input list="haEntities" placeholder="Zoek entiteit, bijv. sensor.accuspanning" autocomplete="off">
        <button type="button" class="btn">Toevoegen</button></div>`;
  };
  const add = () => {
    const inp = $('input', el), id = inp.value.trim().toLowerCase();
    if (!id) return;
    if (!/^[a-z0-9_]+\.[a-z0-9_]+$/.test(id)) { toast('Ongeldige entiteit: ' + id); return; }
    if (!el._list.includes(id)) { el._list.push(id); onChange?.(el._list); }
    draw(); $('input', el).focus();
  };
  el.onclick = ev => {
    const rm = ev.target.closest('[data-rm]');
    if (rm) { el._list.splice(+rm.dataset.rm, 1); onChange?.(el._list); draw(); }
    else if (ev.target.closest('.add button')) add();
  };
  el.onkeydown = ev => { if (ev.key === 'Enter' && ev.target.matches('input')) { ev.preventDefault(); add(); } };
  draw();
  loadHaEntities().then(draw);
}

$('#cats').addEventListener('click', async ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const row = b.closest('.catrow'), id = +row.dataset.id, i = CATS.findIndex(c => c.id === id), c = CATS[i];
  const act = b.dataset.act;
  if (act === 'open') { openCatView(c.naam); return; }
  if (act === 'edit') { catEdit = id; renderCats(); return; }
  if (act === 'cancel') { catEdit = null; renderCats(); return; }
  if (act === 'save') { saveCatEdit(row); return; }
  if (act === 'up' || act === 'down') {
    const j = act === 'up' ? i - 1 : i + 1;
    [CATS[i], CATS[j]] = [CATS[j], CATS[i]];
    renderCats();
    try {
      await api('api/categories/order', {method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ids: CATS.map(c => c.id)})});
      await refreshCategoryLists();
    } catch (e) { toast(e.message); loadCats(); }
    return;
  }
  if (act === 'del') {
    const n = c.logregels + c.taken;
    if (!confirm(`Categorie "${c.naam}" verwijderen?` + (n ? `\n\n${n} logregel(s) en/of taken blijven bewaard, maar zonder categorie.` : ''))) return;
    try {
      await api('api/categories/' + id, {method: 'DELETE'});
      toast('Verwijderd');
      await catsChanged(n > 0);
    } catch (e) { toast(e.message); }
  }
});

$('#cats').addEventListener('keydown', ev => {
  if (!ev.target.matches('[data-edit]')) return;
  if (ev.key === 'Enter') { ev.preventDefault(); saveCatEdit(ev.target.closest('.catrow')); }
  if (ev.key === 'Escape') { ev.preventDefault(); catEdit = null; renderCats(); }
});

// ---------------------------------------------------------------- logregels per categorie
let catView = null;
async function openCatView(naam) {
  catView = naam;
  await renderCatView();
  if (!$('#catDlg').open) $('#catDlg').showModal();
}

async function renderCatView() {
  const list = await api('api/entries?categorie=' + encodeURIComponent(catView));   // nieuwste eerst
  const tijd = list.reduce((s, e) => s + (e.duur_minuten || 0), 0);
  const taken = TASKS.filter(t => t.categorie === catView);
  const cat = CATS.find(c => c.naam === catView);
  $('#catTitle').textContent = catView;
  $('#catBody').innerHTML = `
    <div class="catents"><h3>Meetwaarden uit Home Assistant
      <span class="hint">(bij elke nieuwe logregel in deze categorie automatisch opgeslagen)</span></h3>
      <div class="entpick" id="catEnts"></div></div>
    <div class="stats">${[
      [list.length, list.length === 1 ? 'logregel' : 'logregels'],
      [tijd ? fmtDur(tijd) : '—', 'totale tijd'],
      [taken.length, taken.length === 1 ? 'taak' : 'taken'],
    ].map(([v, l]) => `<div class="stat"><b>${v}</b><span>${esc(l)}</span></div>`).join('')}</div>
    ${list.length ? `<ul class="tl">${list.map(e => tlItem(e, e.taak_naam ? `⟳ ${esc(e.taak_naam)}` : '')).join('')}</ul>`
      : `<div class="empty">Nog geen logregels in deze categorie.</div>`}`;
  $('#catBody')._list = list;
  if (cat) entPicker($('#catEnts'), cat.entiteiten || [], async ids => {
    try {
      const r = await api(`api/categories/${cat.id}/entiteiten`, {method: 'PUT',
        headers: {'Content-Type': 'application/json'}, body: JSON.stringify({entiteiten: ids})});
      cat.entiteiten = r.entiteiten; toast('Meetwaarden opgeslagen');
    } catch (e) { toast(e.message); }
  });
}

$('#catBody').addEventListener('click', tlClick);
$('#catNew').addEventListener('click', () => openEntry(null, {categorie: catView}));
$('#catDlg').addEventListener('close', () => { catView = null; });

// ---------------------------------------------------------------- lightbox
function openLightbox(list, i) { lbList = list; lbIdx = i; showLb(); $('#lightbox').showModal(); }
function showLb() {
  $('#lightbox img').src = lbList[lbIdx];
  $$('#lightbox .nav').forEach(b => b.hidden = lbList.length < 2);
}
$('#lightbox .prev').onclick = () => { lbIdx = (lbIdx - 1 + lbList.length) % lbList.length; showLb(); };
$('#lightbox .next').onclick = () => { lbIdx = (lbIdx + 1) % lbList.length; showLb(); };
$('#lightbox .close').onclick = $('#lightbox img').onclick = () => $('#lightbox').close();
$('#lightbox').addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') $('#lightbox .prev').click();
  if (e.key === 'ArrowRight') $('#lightbox .next').click();
});

// ---------------------------------------------------------------- algemeen
$$('[data-close]').forEach(b => b.addEventListener('click', () => b.closest('dialog').close()));
$$('.tab').forEach(b => b.addEventListener('click', () => {
  TAB = b.dataset.tab;
  $$('.tab').forEach(x => x.classList.toggle('active', x === b));
  $('#view-log').hidden = TAB !== 'log';
  $('#view-tasks').hidden = TAB !== 'tasks';
  $('#view-cats').hidden = TAB !== 'cats';
  $('#fab').hidden = TAB === 'cats';
  if (TAB === 'cats') loadCats();
}));
$('#fab').addEventListener('click', () => TAB === 'log' ? openEntry() : openTask());

(async () => {
  try {
    await loadConfig();
    await Promise.all([loadEntries(), loadTasks()]);
  } catch (e) { toast('Laden mislukt: ' + e.message); }
})();
</script>
